[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptist"
version = "0.2.0"
description = "Lightweight prompt templating and chat rendering with validation and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tsotne Otanadze", email = "otanadzetsotne@gmail.com" }]
keywords = ["prompt", "templating", "LLM", "chat", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "annotated-types==0.7.0",
  "pydantic==2.9.0",
  "pydantic_core==2.23.2",
  "typing_extensions==4.12.2",
  "tzdata==2024.1",
]

[project.optional-dependencies]
connectors = [
  "openai==1.46.0",
  "anthropic==0.34.2",
]
dev = [
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
]

[project.scripts]
promptist = "promptist.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptist*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []


